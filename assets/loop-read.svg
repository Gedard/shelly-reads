<svg xmlns="http://www.w3.org/2000/svg" class="shelly loop-read" viewBox="0 0 200 200" width="400" height="400"><style>.shelly{overflow:visible}
.shelly .crab{transform-origin:100px 180px}
.shelly .shell{transform-origin:100px 162px}
.shelly .shadow{transform-origin:100px 182px}
.shelly .clawL{--d:1;transform-origin:52px 160px}
.shelly .clawR{--d:-1;transform-origin:148px 160px}
.shelly .eyeL{--d:1;transform-origin:88px 124px}
.shelly .eyeR{--d:-1;transform-origin:112px 124px}
.shelly .eyeL .ball{transform-origin:82px 92px}
.shelly .eyeR .ball{transform-origin:118px 92px}
.shelly .spark,.shelly .star,.shelly .z,.shelly .lvtext{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.shelly *{animation:none!important}}
.loop-read .crab{animation:sh-nod 4s ease-in-out infinite}
@keyframes sh-nod{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.loop-read .pupil{animation:sh-scan 4s infinite}
@keyframes sh-scan{0%{transform:translate(-3px,2px)}20%{transform:translate(0,2px)}40%{transform:translate(3px,2px)}45%{transform:translate(-3px,3px)}65%{transform:translate(0,3px)}84%,90%{transform:translate(3px,3px)}100%{transform:translate(-3px,2px)}}
.loop-read .flip{transform-origin:100px 170px;animation:sh-flip 4s ease-in-out infinite}
@keyframes sh-flip{0%{transform:scaleX(1);opacity:0}6%,84%{transform:scaleX(1);opacity:1}94%{transform:scaleX(-1);opacity:1}100%{transform:scaleX(-1);opacity:0}}</style><ellipse class="shadow" cx="100" cy="182" rx="80" ry="7" fill="#000" opacity=".08"/>
 
