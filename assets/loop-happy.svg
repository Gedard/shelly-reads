<svg xmlns="http://www.w3.org/2000/svg" class="shelly loop-happy" viewBox="0 0 200 200" width="400" height="400"><style>.shelly{overflow:visible}
.shelly .crab{transform-origin:100px 180px}
.shelly .shell{transform-origin:100px 162px}
.shelly .shadow{transform-origin:100px 182px}
.shelly .clawL{--d:1;transform-origin:52px 160px}
.shelly .clawR{--d:-1;transform-origin:148px 160px}
.shelly .eyeL{--d:1;transform-origin:88px 124px}
.shelly .eyeR{--d:-1;transform-origin:112px 124px}
.shelly .eyeL .ball{transform-origin:82px 92px}
.shelly .eyeR .ball{transform-origin:118px 92px}
.shelly .spark,.shelly .star,.shelly .z,.shelly .lvtext{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.shelly *{animation:none!important}}
.loop-happy .crab{animation:sh-hop 1.2s cubic-bezier(.3,.7,.4,1) infinite}
@keyframes sh-hop{0%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(.96,1.05)}45%{transform:translateY(-24px) scale(1,1)}75%{transform:translateY(0) scale(1.06,.94)}87%{transform:translateY(0) scale(.99,1.01)}100%{transform:translateY(0) scale(1.06,.94)}}
.loop-happy .shadow{animation:sh-shadow 1.2s infinite}
@keyframes sh-shadow{0%,75%,100%{transform:scale(1)}45%{transform:scale(.7)}}
.loop-happy .claw{animation:sh-wave .6s ease-in-out infinite alternate}
@keyframes sh-wave{from{transform:rotate(calc(var(--d)*-8deg))}to{transform:rotate(calc(var(--d)*28deg))}}
.loop-happy .spark{animation:sh-spark 1.2s infinite}
.loop-happy .s2{animation-delay:-.4s}.loop-happy .s3{animation-delay:-.8s}
@keyframes sh-spark{0%,100%{transform:scale(0);opacity:0}40%{transform:scale(1) rotate(45deg);opacity:1}70%{transform:scale(.6);opacity:0}}</style><ellipse class="shadow" cx="100" cy="182" rx="80" ry="7" fill="#000" opacity=".08"/>
 
