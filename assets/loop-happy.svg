   <path d="M150 172 Q153 178 150 182" style="stroke:var(--rib,#F7C948)" stroke-width="5" fill="none"/>
   <path d="M145.5 180 l0 9 l4.5 -4 l4.5 4 l0 -9z" style="fill:var(--rib,#F7C948)"/>
  </g>
  
  <g class="claw clawL"><path d="M72 158 L60 166 L56 152" stroke="#F4A27A" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="166" r="3.6" fill="#E8906A"/><path transform="translate(57 143) scale(0.72 0.72)" d="M4 12 C-10 14 -15 -2 -7 -11 C-3 -4 1 -2 5 -3 C3 -8 5 -12 9 -15 C17 -6 15 10 4 12Z" fill="#F08A62"/></g>
