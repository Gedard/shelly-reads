  <g class="eye eyeL"><path d="M88 124 Q84 110 82 97" stroke="#F4A27A" stroke-width="5" fill="none" stroke-linecap="round"/><g class="ball"><g transform="translate(82 92) scale(1) translate(-82 -92)"><circle cx="82" cy="92" r="10" fill="#fff" stroke="#3a2e2a" stroke-width="1.5"/><path d="M76 95 Q82 86 88 95" stroke="#3a2e2a" stroke-width="3" fill="none" stroke-linecap="round"/></g></g></g><g class="eye eyeR"><path d="M112 124 Q116 110 118 97" stroke="#F4A27A" stroke-width="5" fill="none" stroke-linecap="round"/><g class="ball"><g transform="translate(118 92) scale(1) translate(-118 -92)"><circle cx="118" cy="92" r="10" fill="#fff" stroke="#3a2e2a" stroke-width="1.5"/><path d="M112 95 Q118 86 124 95" stroke="#3a2e2a" stroke-width="3" fill="none" stroke-linecap="round"/></g></g></g>
  </g></g>
